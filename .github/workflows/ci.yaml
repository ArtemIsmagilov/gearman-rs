name: CI

on: [pull_request, push]
jobs:
  cross-check:
    name: Check crossplatform.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run cross checks
        run: |
          cargo check --features tokio-tls --all-targets

  rustfmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run fmt checks
        run: |
          cargo fmt --all --check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Up gearmand server
        run: |
          docker compose up -d
      - name: Run tests
        run: |
          cargo test --features tokio-tls
